<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>TOTZ RUN V3.1</title><link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Nunito:wght@700;800&display=swap" rel="stylesheet"><script>window.__totzStart=false;window.fireTotzStart=function(){window.__totzStart=true;var o=document.getElementById('overlay');if(o)o.style.display='none';var s=document.getElementById('status');if(s)s.textContent='RUNNING';window.dispatchEvent(new Event('totz-start'));};</script><script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.166.1/build/three.module.js","three/addons/":"https://unpkg.com/three@0.166.1/examples/jsm/"}}</script><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#bfe6ee;font-family:Nunito,sans-serif;color:#2b2140;touch-action:none}.ui{position:fixed;inset:0;pointer-events:none}.top{position:absolute;top:14px;left:16px;right:16px;display:flex;justify-content:space-between;align-items:center;z-index:10}.logo{font:800 24px 'Baloo 2'}.home{pointer-events:auto;text-decoration:none;color:#2b2140;background:#fff3dc;border:2px solid #2b2140;border-radius:999px;padding:9px 14px;font-weight:800}.hud{position:absolute;top:14px;left:50%;transform:translateX(-50%);display:flex;gap:8px;z-index:10}.pill{min-width:88px;background:#ffffffdf;border:2px solid #2b214018;border-radius:16px;padding:7px 12px;text-align:center}.pill small{display:block;font-size:10px;font-weight:800;color:#5b5270}.pill b{font:800 19px 'Baloo 2'}.overlay{position:absolute;inset:0;display:grid;place-items:center;background:#bfe6ee66;backdrop-filter:blur(3px);z-index:30;pointer-events:auto}.card{width:min(560px,92vw);background:#fffffff4;border:3px solid #2b214018;border-radius:28px;padding:28px;text-align:center;box-shadow:0 22px 60px #2b21402b}.badge{display:inline-block;background:#cbdb2a;border-radius:999px;padding:7px 13px;font-size:12px;font-weight:800}.card h1{font:800 clamp(48px,10vw,82px)/.85 'Baloo 2';margin:14px 0 10px}.card h1 span{color:#f0533d}.card p{font-weight:800;color:#5b5270;line-height:1.5}.start{border:0;border-radius:999px;background:#ff7a66;color:white;padding:14px 28px;font:800 18px 'Baloo 2';box-shadow:0 8px 0 #f0533d;cursor:pointer}.load{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:15;background:#fff3dc;padding:10px 15px;border-radius:999px;font-weight:800}.status{position:absolute;left:50%;top:92px;transform:translateX(-50%);z-index:10;background:#ffffffc9;padding:7px 11px;border-radius:999px;font-size:11px;font-weight:800}.controls{position:absolute;left:18px;right:18px;bottom:22px;display:flex;justify-content:space-between;z-index:15}.btn{pointer-events:auto;width:64px;height:64px;border:2px solid #2b21401f;border-radius:20px;background:#ffffffe8;font:800 24px 'Baloo 2';color:#2b2140}.jump{width:90px;background:#ff7a66ec;color:white;font-size:14px}.toast{position:absolute;top:122px;left:50%;transform:translateX(-50%);background:#cbdb2a;padding:8px 14px;border-radius:999px;font-weight:800;opacity:0;transition:.2s}.toast.show{opacity:1}@media(min-width:850px){.controls{display:none}}@media(max-width:849px){.hud{top:64px}.pill{min-width:76px;padding:6px 8px}.pill b{font-size:16px}.status{top:112px}}</style></head><body><canvas id="game"></canvas><div class="ui"><div class="top"><div class="logo">● TOTZ RUN</div><a class="home" href="index.html">← Back home</a></div><div class="hud"><div class="pill"><small>SCORE</small><b id="score">0</b></div><div class="pill"><small>$TOTZ</small><b id="coins">0</b></div><div class="pill"><small>BEST</small><b id="best">0</b></div></div><div class="status" id="status">READY</div><div class="load" id="load">Loading avatar…</div><div class="toast" id="toast">+1 $TOTZ</div><div class="overlay" id="overlay"><div class="card"><span class="badge">🏃 REALISTIC MOTION V3.1</span><h1>TOTZ <span>RUN</span></h1><p>Natural gait, smoother lane lean, jump pose and shiny Gold Canvas. Start now works independently from avatar loading.</p><button class="start" id="startButton" onclick="fireTotzStart()">START RUN</button><p style="font-size:12px;margin-bottom:0">A / D or ← / → move • SPACE / ↑ jump</p></div></div><div class="controls"><div><button class="btn" id="left">←</button><button class="btn" id="right">→</button></div><button class="btn jump" id="jump">JUMP</button></div></div><script type="module">import * as THREE from 'three';import{GLTFLoader}from'three/addons/loaders/GLTFLoader.js';const MML='https://raw.githubusercontent.com/aitchrif/otherside-avatar/main/avatar.mml';const canvas=document.getElementById('game'),scoreEl=document.getElementById('score'),coinsEl=document.getElementById('coins'),bestEl=document.getElementById('best'),loadEl=document.getElementById('load'),statusEl=document.getElementById('status'),toastEl=document.getElementById('toast');const renderer=new THREE.WebGLRenderer({canvas,antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,1.6));renderer.shadowMap.enabled=true;renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.18;const scene=new THREE.Scene();scene.background=new THREE.Color(0xbfe6ee);scene.fog=new THREE.Fog(0xbfe6ee,28,95);const envScene=new THREE.Scene();const envWhite=new THREE.MeshBasicMaterial({color:0xffffff}),envGold=new THREE.MeshBasicMaterial({color:0xffc84d}),envBlue=new THREE.MeshBasicMaterial({color:0x8ed2e2});[[0,3,-5,10,10,envWhite],[5,2,0,10,10,envGold],[-5,2,0,10,10,envBlue]].forEach(v=>{const m=new THREE.Mesh(new THREE.PlaneGeometry(v[3],v[4]),v[5]);m.position.set(v[0],v[1],v[2]);if(v[0]>0)m.rotation.y=-Math.PI/2;if(v[0]<0)m.rotation.y=Math.PI/2;envScene.add(m)});scene.environment=new THREE.PMREMGenerator(renderer).fromScene(envScene,.08).texture;const camera=new THREE.PerspectiveCamera(54,1,.1,160);camera.position.set(0,5.15,11.5);camera.lookAt(0,1.55,-8);scene.add(new THREE.HemisphereLight(0xffffff,0xffd27a,2));const sun=new THREE.DirectionalLight(0xfff6df,3.1);sun.position.set(7,11,7);sun.castShadow=true;scene.add(sun);const warm=new THREE.DirectionalLight(0xffc43f,2.8);warm.position.set(-5,5,4);scene.add(warm);const cool=new THREE.DirectionalLight(0x8ed2e2,1.3);cool.position.set(5,4,-7);scene.add(cool);const world=new THREE.Group();scene.add(world);const lanes=[-2.5,0,2.5],road=new THREE.Mesh(new THREE.BoxGeometry(9,.35,140),new THREE.MeshStandardMaterial({color:0xfff3dc,roughness:.8}));road.position.set(0,-.18,-42);world.add(road);[-4.6,4.6].forEach(x=>{const m=new THREE.Mesh(new THREE.BoxGeometry(.18,.4,140),new THREE.MeshStandardMaterial({color:0x2b2140}));m.position.set(x,0,-42);world.add(m)});[-1.25,1.25].forEach(x=>{for(let z=-105;z<18;z+=8){const d=new THREE.Mesh(new THREE.BoxGeometry(.08,.02,3),new THREE.MeshBasicMaterial({color:0xffffff,transparent:true,opacity:.55}));d.position.set(x,.02,z);d.userData.dash=1;world.add(d)}});for(let i=0;i<18;i++){const g=new THREE.Group(),mat=new THREE.MeshLambertMaterial({color:0xffffff,transparent:true,opacity:.8});[[0,0,.7],[.7,0,1],[-.7,0,.8],[.15,.35,.65]].forEach(a=>{const q=new THREE.Mesh(new THREE.SphereGeometry(a[2],16,12),mat);q.position.set(a[0],a[1],0);g.add(q)});g.position.set((Math.random()-.5)*30,3+Math.random()*10,-10-Math.random()*100);g.userData.cloud=1;scene.add(g)}const player=new THREE.Group();player.position.set(0,0,3);scene.add(player);let avatar=null,avatarBaseY=0;const bones={},rest={},boneNames=['pelvis','spine_01','spine_02','spine_03','clavicle_l','clavicle_r','upperarm_l','upperarm_r','lowerarm_l','lowerarm_r','thigh_l','thigh_r','calf_l','calf_r','foot_l','foot_r','neck_01','head'];function cacheRig(){boneNames.forEach(n=>{const b=avatar.getObjectByName(n);if(b){bones[n]=b;rest[n]={x:b.rotation.x,y:b.rotation.y,z:b.rotation.z}}})}function br(n,x=0,y=0,z=0,a=.2){const b=bones[n],q=rest[n];if(!b||!q)return;b.rotation.x=THREE.MathUtils.lerp(b.rotation.x,q.x+x,a);b.rotation.y=THREE.MathUtils.lerp(b.rotation.y,q.y+y,a);b.rotation.z=THREE.MathUtils.lerp(b.rotation.z,q.z+z,a)}function tuneGold(){avatar.traverse(o=>{if(!o.isMesh)return;o.castShadow=true;o.receiveShadow=true;(Array.isArray(o.material)?o.material:[o.material]).forEach(m=>{const n=(m.name||'').toLowerCase();m.envMapIntensity=1.7;if(n.includes('gold')||n.includes('canvas')||n.includes('halo')){m.metalness=.94;m.roughness=.14;m.envMapIntensity=3.4;m.needsUpdate=true}})})}async function loadAvatar(){try{const txt=await fetch(MML,{cache:'no-store'}).then(r=>r.text());const u=txt.match(/<m-character[^>]+src=[\"']([^\"']+)[\"']/i)?.[1];if(!u)throw new Error('No GLB in MML');const gltf=await new GLTFLoader().loadAsync(u);avatar=gltf.scene;const b=new THREE.Box3().setFromObject(avatar),sz=b.getSize(new THREE.Vector3()),ct=b.getCenter(new THREE.Vector3());avatar.position.sub(ct);avatar.scale.setScalar(2.8/(Math.max(sz.x,sz.y,sz.z)||1));const b2=new THREE.Box3().setFromObject(avatar),sz2=b2.getSize(new THREE.Vector3()),ct2=b2.getCenter(new THREE.Vector3());avatar.position.sub(ct2);avatar.position.y=sz2.y/2;avatarBaseY=avatar.position.y;avatar.rotation.y=Math.PI;player.add(avatar);cacheRig();tuneGold();loadEl.style.display='none';statusEl.textContent=state==='play'?'RUNNING':'AVATAR READY'}catch(e){console.error(e);loadEl.textContent='Avatar failed';statusEl.textContent='RUN STILL AVAILABLE'}}let obstacles=[],pickups=[],state=window.__totzStart?'play':'menu',lane=1,targetX=0,yVel=0,onGround=true,score=0,collected=0,speed=.34,obsTimer=24,pickTimer=46,last=performance.now(),lean=0,landing=0,best=+localStorage.getItem('totzBestV31')||0;bestEl.textContent=best;function reset(){obstacles.forEach(o=>world.remove(o.m));pickups.forEach(m=>world.remove(m));obstacles=[];pickups=[];lane=1;targetX=0;player.position.set(0,0,3);player.rotation.z=0;yVel=0;onGround=true;score=0;collected=0;speed=.34;obsTimer=24;pickTimer=46;landing=0;scoreEl.textContent='0';coinsEl.textContent='0'}function startGame(){reset();state='play';statusEl.textContent='RUNNING';last=performance.now()}window.addEventListener('totz-start',startGame);if(window.__totzStart)startGame();function move(d){if(state!=='play')return;lane=Math.max(0,Math.min(2,lane+d));targetX=lanes[lane];lean=-d*.10}function jumpNow(){if(state==='play'&&onGround){yVel=.23;onGround=false}}function spawnObstacle(){const h=Math.random()<.28?2.35:1.2,m=new THREE.Mesh(new THREE.BoxGeometry(1.45,h,1.4),new THREE.MeshStandardMaterial({color:0x2b2140,roughness:.65}));m.position.set(lanes[Math.floor(Math.random()*3)],h/2,-72);world.add(m);obstacles.push({m,h})}function spawnPickup(){const m=new THREE.Mesh(new THREE.TorusGeometry(.38,.13,12,28),new THREE.MeshStandardMaterial({color:0xd7e936,metalness:.42,roughness:.22,envMapIntensity:2.4}));m.rotation.x=Math.PI/2;m.position.set(lanes[Math.floor(Math.random()*3)],1.25+Math.random(),-70);world.add(m);pickups.push(m)}function collect(m){collected++;coinsEl.textContent=collected;score+=90;m.userData.dead=1;world.remove(m);toastEl.classList.add('show');setTimeout(()=>toastEl.classList.remove('show'),350)}function gameOver(){if(state!=='play')return;state='over';statusEl.textContent='CLOUD DOWN';const sc=Math.floor(score);if(sc>best){best=sc;localStorage.setItem('totzBestV31',best);bestEl.textContent=best}const overlay=document.getElementById('overlay');overlay.style.display='grid';overlay.querySelector('h1').innerHTML='CLOUD <span>DOWN!</span>';overlay.querySelector('p').innerHTML='Score <b>'+sc+'</b> • '+collected+' $TOTZ';document.getElementById('startButton').textContent='RUN AGAIN';window.__totzStart=false}function pose(t,dt){if(!avatar)return;avatar.position.y=avatarBaseY;if(state!=='play'){boneNames.forEach(n=>br(n,0,0,0,.08));br('spine_02',Math.sin(t*1.8)*.012,0,0,.06);return}if(!onGround){br('thigh_l',-.32,0,.04,.24);br('thigh_r',-.32,0,-.04,.24);br('calf_l',.72,0,0,.24);br('calf_r',.72,0,0,.24);br('foot_l',-.18,0,0,.2);br('foot_r',-.18,0,0,.2);br('upperarm_l',-.38,0,-.08,.2);br('upperarm_r',-.38,0,.08,.2);br('lowerarm_l',-.30,0,0,.2);br('lowerarm_r',-.30,0,0,.2);br('spine_01',.09,0,-player.rotation.z*.4,.16);br('head',-.02,0,player.rotation.z*.2,.12);return}const cadence=8+speed*4.6,p=t*cadence,sn=Math.sin(p),ls=Math.max(0,sn),rs=Math.max(0,-sn),lb=Math.max(0,-sn),rb=Math.max(0,sn),bounce=Math.abs(Math.sin(p)),stride=.48+speed*.18,knee=.75+speed*.1,arm=.48+speed*.15;br('thigh_l',sn*stride,0,0,.22);br('thigh_r',-sn*stride,0,0,.22);br('calf_l',ls*knee+lb*.08,0,0,.23);br('calf_r',rs*knee+rb*.08,0,0,.23);br('foot_l',-.10*ls+.08*lb,0,0,.18);br('foot_r',-.10*rs+.08*rb,0,0,.18);br('upperarm_l',-sn*arm,0,-.035,.20);br('upperarm_r',sn*arm,0,.035,.20);br('lowerarm_l',-.20-.16*Math.max(0,-sn),0,0,.18);br('lowerarm_r',-.20-.16*Math.max(0,sn),0,0,.18);br('pelvis',-.03,sn*.05,sn*.022,.16);br('spine_01',.07,-sn*.03,-player.rotation.z*.5,.14);br('spine_02',.018,-sn*.025,-player.rotation.z*.2,.13);br('spine_03',0,-sn*.02,-player.rotation.z*.10,.13);br('neck_01',-.018,sn*.015,player.rotation.z*.16,.11);br('head',-.015,sn*.010,player.rotation.z*.22,.10);landing=Math.max(0,landing-dt*.075);avatar.position.y=avatarBaseY+bounce*.026-landing*landing*.055}document.getElementById('left').onclick=()=>move(-1);document.getElementById('right').onclick=()=>move(1);document.getElementById('jump').onclick=jumpNow;addEventListener('keydown',e=>{if(['ArrowLeft','ArrowRight','ArrowUp','Space','KeyA','KeyD'].includes(e.code))e.preventDefault();if(e.code==='ArrowLeft'||e.code==='KeyA')move(-1);if(e.code==='ArrowRight'||e.code==='KeyD')move(1);if(e.code==='ArrowUp'||e.code==='Space')jumpNow()});let sx=null;canvas.onpointerdown=e=>sx=e.clientX;canvas.onpointerup=e=>{if(sx==null)return;const dx=e.clientX-sx;Math.abs(dx)>45?move(dx>0?1:-1):jumpNow();sx=null};function resize(){renderer.setSize(innerWidth,innerHeight,false);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix()}addEventListener('resize',resize);resize();loadAvatar();const clock=new THREE.Clock();function loop(now){requestAnimationFrame(loop);const dt=Math.min(2,(now-last)/16.667);last=now;clock.getDelta();const t=clock.elapsedTime;player.position.x+=(targetX-player.position.x)*Math.min(1,.15*dt);lean*=Math.pow(.84,dt);player.rotation.z+=(lean-player.rotation.z)*.13*dt;pose(t,dt);if(state==='play'){score+=dt*.8;speed=Math.min(.72,.34+score/9000);yVel-=.013*dt;player.position.y+=yVel*dt;if(player.position.y<=0){if(!onGround&&yVel<-.04)landing=Math.min(1,Math.abs(yVel)*3.1);player.position.y=0;yVel=0;onGround=true}obsTimer-=dt;pickTimer-=dt;if(obsTimer<=0){spawnObstacle();obsTimer=50+Math.random()*30}if(pickTimer<=0){spawnPickup();pickTimer=42+Math.random()*44}for(const o of obstacles){o.m.position.z+=speed*dt*6.1;if(Math.abs(o.m.position.z-player.position.z)<1.05&&Math.abs(o.m.position.x-player.position.x)<.88&&player.position.y<=o.h*.62){gameOver();break}}for(const m of pickups){if(m.userData.dead)continue;m.position.z+=speed*dt*6.1;m.rotation.y+=.05*dt;if(Math.abs(m.position.z-player.position.z)<1.05&&Math.abs(m.position.x-player.position.x)<.85&&Math.abs(m.position.y-(player.position.y+1.1))<1.2)collect(m)}obstacles=obstacles.filter(o=>{if(o.m.position.z>14){world.remove(o.m);return false}return true});pickups=pickups.filter(m=>!m.userData.dead&&m.position.z<14);world.children.forEach(m=>{if(m.userData.dash){m.position.z+=speed*dt*6.1;if(m.position.z>15)m.position.z-=120}});scoreEl.textContent=Math.floor(score)}scene.children.forEach(o=>{if(o.userData.cloud){o.position.z+=.008*dt;if(o.position.z>18)o.position.z=-105}});camera.position.x+=(player.position.x*.14-camera.position.x)*.03*dt;camera.lookAt(player.position.x*.15,1.55,-8);renderer.render(scene,camera)}requestAnimationFrame(loop);</script></body></html>
