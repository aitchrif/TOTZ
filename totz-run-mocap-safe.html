<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>TOTZ RUN — SAFE MOCAP</title><link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Nunito:wght@700;800&display=swap" rel="stylesheet"><script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.166.1/build/three.module.js","three/addons/":"https://unpkg.com/three@0.166.1/examples/jsm/"}}</script><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:Nunito,sans-serif;background:#bfe6ee;color:#2b2140;touch-action:none}.ui{position:fixed;inset:0;pointer-events:none}.top{position:absolute;top:16px;left:18px;right:18px;display:flex;justify-content:space-between;z-index:10}.logo{font:800 24px 'Baloo 2'}.home{pointer-events:auto;text-decoration:none;color:#2b2140;background:#fff3dc;border:2px solid #2b2140;border-radius:999px;padding:9px 14px;font-weight:800}.hud{position:absolute;top:16px;left:50%;transform:translateX(-50%);display:flex;gap:8px}.pill{background:#ffffffdd;border-radius:16px;padding:7px 14px;text-align:center;min-width:92px}.pill small{display:block;font-size:10px;font-weight:800;color:#5b5270}.pill b{font:800 20px 'Baloo 2'}.status{position:absolute;top:88px;left:50%;transform:translateX(-50%);background:#fff3dc;border-radius:999px;padding:8px 13px;font-weight:800;font-size:12px}.overlay{position:absolute;inset:0;display:grid;place-items:center;background:#bfe6ee66;backdrop-filter:blur(3px);pointer-events:auto;z-index:20}.card{width:min(560px,92vw);padding:28px;text-align:center;background:#fffffff2;border-radius:28px;box-shadow:0 22px 60px #2b214029}.badge{display:inline-block;background:#cbdb2a;border-radius:999px;padding:7px 13px;font-weight:800;font-size:12px}.card h1{font:800 clamp(48px,10vw,82px)/.85 'Baloo 2';margin:14px 0 10px}.card h1 span{color:#f0533d}.card p{color:#5b5270;font-weight:800;line-height:1.5}.start{border:0;border-radius:999px;background:#ff7a66;color:#fff;padding:14px 28px;font:800 18px 'Baloo 2';box-shadow:0 8px 0 #f0533d;cursor:pointer}.controls{position:absolute;left:18px;right:18px;bottom:22px;display:flex;justify-content:space-between}.move{display:flex;gap:10px}.btn{pointer-events:auto;width:64px;height:64px;border:0;border-radius:20px;background:#ffffffe5;font:800 24px 'Baloo 2';color:#2b2140}.jump{width:90px;background:#ff7a66e8;color:white;font-size:14px}@media(min-width:850px){.controls{display:none}}@media(max-width:849px){.hud{top:62px}.status{top:108px}.pill{min-width:78px;padding:6px 9px}.pill b{font-size:16px}}</style></head><body><canvas id="gameCanvas"></canvas><div class="ui"><div class="top"><div class="logo">● TOTZ RUN</div><a class="home" href="index.html">← Back home</a></div><div class="hud"><div class="pill"><small>SCORE</small><b id="score">0</b></div><div class="pill"><small>$TOTZ</small><b id="coins">0</b></div><div class="pill"><small>BEST</small><b id="best">0</b></div></div><div class="status" id="status">Loading TOTZ…</div><div class="overlay" id="overlay"><div class="card"><span class="badge">🏃 SAFE REAL MOCAP</span><h1>TOTZ <span>RUN</span></h1><p>Real running motion, but only bone rotations are transferred. TOTZ keeps its own position, scale and bind pose, so the avatar cannot fly away or disappear.</p><button class="start" id="startButton">START RUN</button><p style="font-size:12px;margin-bottom:0">A / D or ← / → move • SPACE / ↑ jump</p></div></div><div class="controls"><div class="move"><button class="btn" id="leftButton">←</button><button class="btn" id="rightButton">→</button></div><button class="btn jump" id="jumpButton">JUMP</button></div></div><script type="module">import * as THREE from 'three';import{GLTFLoader}from'three/addons/loaders/GLTFLoader.js';import{RoomEnvironment}from'three/addons/environments/RoomEnvironment.js';const MML='https://raw.githubusercontent.com/aitchrif/otherside-avatar/main/avatar.mml';const RUN_JSON='https://raw.githubusercontent.com/nirholas/three.ws/b71b8135f4396b29f540f771c169a72160fa2883/public/animations/clips/soldier-run.json';const canvas=document.querySelector('#gameCanvas'),scoreEl=document.querySelector('#score'),coinsEl=document.querySelector('#coins'),bestEl=document.querySelector('#best'),statusEl=document.querySelector('#status'),overlayEl=document.querySelector('#overlay'),startEl=document.querySelector('#startButton'),leftEl=document.querySelector('#leftButton'),rightEl=document.querySelector('#rightButton'),jumpEl=document.querySelector('#jumpButton');const renderer=new THREE.WebGLRenderer({canvas,antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,1.7));renderer.shadowMap.enabled=true;renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.22;const pmrem=new THREE.PMREMGenerator(renderer),env=pmrem.fromScene(new RoomEnvironment(),.05).texture,scene=new THREE.Scene();scene.background=new THREE.Color(0xbfe6ee);scene.fog=new THREE.Fog(0xbfe6ee,28,96);scene.environment=env;const camera=new THREE.PerspectiveCamera(54,1,.1,160);camera.position.set(0,5.15,11.6);camera.lookAt(0,1.55,-8);scene.add(new THREE.HemisphereLight(0xffffff,0xffd27a,2));const sun=new THREE.DirectionalLight(0xfff7e5,3.2);sun.position.set(7,11,7);sun.castShadow=true;scene.add(sun);const rim=new THREE.DirectionalLight(0xffc83d,3.1);rim.position.set(-6,5,3);scene.add(rim);const world=new THREE.Group();scene.add(world);const lanes=[-2.5,0,2.5],road=new THREE.Mesh(new THREE.BoxGeometry(9,.35,140),new THREE.MeshStandardMaterial({color:0xfff3dc,roughness:.8}));road.position.set(0,-.18,-42);world.add(road);[-4.6,4.6].forEach(x=>{const m=new THREE.Mesh(new THREE.BoxGeometry(.18,.4,140),new THREE.MeshStandardMaterial({color:0x2b2140}));m.position.set(x,0,-42);world.add(m)});[-1.25,1.25].forEach(x=>{for(let z=-105;z<18;z+=8){const d=new THREE.Mesh(new THREE.BoxGeometry(.08,.02,3),new THREE.MeshBasicMaterial({color:0xffffff,transparent:true,opacity:.55}));d.position.set(x,.02,z);d.userData.dash=1;world.add(d)}});for(let i=0;i<16;i++){const g=new THREE.Group(),mat=new THREE.MeshLambertMaterial({color:0xffffff,transparent:true,opacity:.8});[[0,0,.7],[.7,0,1],[-.7,0,.8],[.15,.35,.65]].forEach(a=>{const q=new THREE.Mesh(new THREE.SphereGeometry(a[2],16,12),mat);q.position.set(a[0],a[1],0);g.add(q)});g.position.set((Math.random()-.5)*30,3+Math.random()*10,-10-Math.random()*100);g.userData.cloud=1;scene.add(g)}const player=new THREE.Group();player.position.set(0,0,3);scene.add(player);let avatar=null,mixer=null,runAction=null;const targetRest={};const alias={Hips:'pelvis',Spine:'spine_01',Spine1:'spine_02',Spine2:'spine_03',Neck:'neck_01',Head:'head',LeftShoulder:'clavicle_l',LeftArm:'upperarm_l',LeftForeArm:'lowerarm_l',LeftHand:'hand_l',RightShoulder:'clavicle_r',RightArm:'upperarm_r',RightForeArm:'lowerarm_r',RightHand:'hand_r',LeftUpLeg:'thigh_l',LeftLeg:'calf_l',LeftFoot:'foot_l',LeftToeBase:'ball_l',RightUpLeg:'thigh_r',RightLeg:'calf_r',RightFoot:'foot_r',RightToeBase:'ball_r'};function tuneGold(root){root.traverse(o=>{if(!o.isMesh)return;o.castShadow=true;o.receiveShadow=true;(Array.isArray(o.material)?o.material:[o.material]).forEach(m=>{const n=(m.name||'').toLowerCase();m.envMapIntensity=1.8;if(n.includes('gold')||n.includes('canvas')||n.includes('halo')){m.metalness=.95;m.roughness=.13;m.envMapIntensity=3.6;m.needsUpdate=true}})})}function normSource(n){return n.replace(/^mixamorig\d*[:_]?/i,'')}function buildRotationClip(json){const tracks=[];for(const tr of json.tracks||[]){const dot=tr.name.lastIndexOf('.');if(dot<0)continue;const src=normSource(tr.name.slice(0,dot)),prop=tr.name.slice(dot+1);if(prop!=='quaternion')continue;const target=alias[src];if(!target||!targetRest[target])continue;const times=Float32Array.from(tr.times),vals=tr.values,q0=new THREE.Quaternion(vals[0],vals[1],vals[2],vals[3]).normalize(),q0Inv=q0.clone().invert(),rest=targetRest[target],out=new Float32Array(vals.length);for(let i=0;i<vals.length;i+=4){const qs=new THREE.Quaternion(vals[i],vals[i+1],vals[i+2],vals[i+3]).normalize();const delta=q0Inv.clone().multiply(qs);const qt=rest.clone().multiply(delta).normalize();out[i]=qt.x;out[i+1]=qt.y;out[i+2]=qt.z;out[i+3]=qt.w}tracks.push(new THREE.QuaternionKeyframeTrack(target+'.quaternion',times,out))}return new THREE.AnimationClip('TOTZ_REAL_RUN_ROT_ONLY',json.duration||-1,tracks)}async function loadAll(){try{const txt=await fetch(MML,{cache:'no-store'}).then(r=>r.text()),glbUrl=txt.match(/<m-character[^>]+src=[\"']([^\"']+)[\"']/i)?.[1];if(!glbUrl)throw new Error('No GLB');const gltf=await new GLTFLoader().loadAsync(glbUrl);avatar=gltf.scene;const box=new THREE.Box3().setFromObject(avatar),size=box.getSize(new THREE.Vector3()),center=box.getCenter(new THREE.Vector3());avatar.position.sub(center);avatar.scale.setScalar(2.8/(Math.max(size.x,size.y,size.z)||1));const box2=new THREE.Box3().setFromObject(avatar),size2=box2.getSize(new THREE.Vector3()),center2=box2.getCenter(new THREE.Vector3());avatar.position.sub(center2);avatar.position.y=size2.y/2;avatar.rotation.y=Math.PI;for(const t of Object.values(alias)){const b=avatar.getObjectByName(t);if(b&&!targetRest[t])targetRest[t]=b.quaternion.clone()}tuneGold(avatar);player.add(avatar);statusEl.textContent='Loading real run clip…';const runJson=await fetch(RUN_JSON,{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('run json '+r.status);return r.json()});const clip=buildRotationClip(runJson);if(!clip.tracks.length)throw new Error('No mapped rotation tracks');mixer=new THREE.AnimationMixer(avatar);runAction=mixer.clipAction(clip);runAction.setLoop(THREE.LoopRepeat,Infinity);runAction.play();runAction.paused=true;statusEl.textContent='MOCAP READY ✓';}catch(e){console.error(e);statusEl.textContent='Avatar/mocap failed'}}loadAll();let obstacles=[],pickups=[],state='menu',lane=1,targetX=0,yVel=0,onGround=true,score=0,count=0,speed=.34,obsTimer=24,pickTimer=42,last=performance.now(),lean=0,best=+localStorage.getItem('totzBestSafeMocap')||0;bestEl.textContent=best;function spawnObstacle(){const h=Math.random()<.3?2.4:1.2,m=new THREE.Mesh(new THREE.BoxGeometry(1.45,h,1.4),new THREE.MeshStandardMaterial({color:0x2b2140,roughness:.65}));m.position.set(lanes[Math.floor(Math.random()*3)],h/2,-72);world.add(m);obstacles.push({m,h})}function spawnCoin(){const m=new THREE.Mesh(new THREE.TorusGeometry(.38,.13,12,28),new THREE.MeshStandardMaterial({color:0xd8ea35,metalness:.45,roughness:.2}));m.rotation.x=Math.PI/2;m.position.set(lanes[Math.floor(Math.random()*3)],1.2,-70);world.add(m);pickups.push(m)}function reset(){obstacles.forEach(o=>world.remove(o.m));pickups.forEach(m=>world.remove(m));obstacles=[];pickups=[];lane=1;targetX=0;player.position.set(0,0,3);player.rotation.z=0;yVel=0;onGround=true;score=0;count=0;speed=.34;obsTimer=24;pickTimer=42;scoreEl.textContent='0';coinsEl.textContent='0';if(runAction){runAction.reset().play();runAction.paused=false}}function start(){reset();state='play';overlayEl.style.display='none'}function move(d){if(state!=='play')return;lane=Math.max(0,Math.min(2,lane+d));targetX=lanes[lane];lean=-d*.06}function jump(){if(state==='play'&&onGround){yVel=.23;onGround=false}}function over(){if(state!=='play')return;state='over';if(runAction)runAction.paused=true;const sc=Math.floor(score);if(sc>best){best=sc;localStorage.setItem('totzBestSafeMocap',best);bestEl.textContent=best}document.querySelector('.card h1').innerHTML='CLOUD <span>DOWN!</span>';document.querySelector('.card p').innerHTML=`Score <b>${sc}</b> • ${count} $TOTZ`;startEl.textContent='RUN AGAIN';overlayEl.style.display='grid'}startEl.onclick=start;leftEl.onclick=()=>move(-1);rightEl.onclick=()=>move(1);jumpEl.onclick=jump;addEventListener('keydown',e=>{if(e.code==='ArrowLeft'||e.code==='KeyA')move(-1);if(e.code==='ArrowRight'||e.code==='KeyD')move(1);if(e.code==='ArrowUp'||e.code==='Space')jump()});let tx=null;canvas.onpointerdown=e=>tx=e.clientX;canvas.onpointerup=e=>{if(tx==null)return;const dx=e.clientX-tx;Math.abs(dx)>45?move(dx>0?1:-1):jump();tx=null};function resize(){renderer.setSize(innerWidth,innerHeight,false);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix()}addEventListener('resize',resize);resize();const clock=new THREE.Clock();function loop(now){requestAnimationFrame(loop);const dt=Math.min(2,(now-last)/16.667);last=now;const sec=clock.getDelta();player.position.x+=(targetX-player.position.x)*Math.min(1,.15*dt);lean*=Math.pow(.86,dt);player.rotation.z+=(lean-player.rotation.z)*.1*dt;if(runAction){runAction.paused=state!=='play';runAction.timeScale=.92+(speed-.34)*1.2;if(state==='play')mixer.update(sec)}if(state==='play'){score+=dt*.8;speed=Math.min(.72,.34+score/9000);yVel-=.013*dt;player.position.y+=yVel*dt;if(player.position.y<=0){player.position.y=0;yVel=0;onGround=true}obsTimer-=dt;pickTimer-=dt;if(obsTimer<=0){spawnObstacle();obsTimer=52+Math.random()*30}if(pickTimer<=0){spawnCoin();pickTimer=44+Math.random()*44}for(const o of obstacles){o.m.position.z+=speed*dt*6.1;if(Math.abs(o.m.position.z-player.position.z)<1.05&&Math.abs(o.m.position.x-player.position.x)<.88&&player.position.y<=o.h*.62){over();break}}for(const m of pickups){m.position.z+=speed*dt*6.1;m.rotation.y+=.05*dt;if(!m.userData.dead&&Math.abs(m.position.z-player.position.z)<1.05&&Math.abs(m.position.x-player.position.x)<.85){m.userData.dead=1;count++;coinsEl.textContent=count;score+=90;world.remove(m)}}obstacles=obstacles.filter(o=>{if(o.m.position.z>14){world.remove(o.m);return false}return true});pickups=pickups.filter(m=>!m.userData.dead&&m.position.z<14);world.children.forEach(m=>{if(m.userData.dash){m.position.z+=speed*dt*6.1;if(m.position.z>15)m.position.z-=120}});scoreEl.textContent=Math.floor(score)}scene.children.forEach(o=>{if(o.userData.cloud){o.position.z+=.008*dt;if(o.position.z>18)o.position.z=-105}});camera.position.x+=(player.position.x*.14-camera.position.x)*.03*dt;camera.lookAt(player.position.x*.15,1.55,-8);renderer.render(scene,camera)}requestAnimationFrame(loop);</script></body></html>
