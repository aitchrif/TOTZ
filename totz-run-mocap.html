button></div><button class="btn jump" id="jumpButton">JUMP</button></div></div><script>window.__totzStartRequested=false;addEventListener('DOMContentLoaded',()=>{const b=document.querySelector('#startButton'),o=document.querySelector('#overlay');b.addEventListener('click',()=>{window.__totzStartRequested=true;o.style.display='none';window.dispatchEvent(new Event('totz-start'))})});</script><script type="module">import * as THREE from 'three';import{GLTFLoader}from'three/addons/loaders/GLTFLoader.js';import{FBXLoader}from'three/addons/loaders/FBXLoader.js';import{RoomEnvironment}from'three/addons/environments/RoomEnvironment.js';import * as SkeletonUtils from'three/addons/utils/SkeletonUtils.js';const MML='https://raw.githubusercontent.com/aitchrif/otherside-avatar/main/avatar.mml';const RUN='https://raw.githubusercontent.com/M3-org/CharacterStudio/293182bf4a6087f4a4a7fd00e4fbdfb590029da7/public/lora-assets/animations/Running.fbx';const canvas=document.querySelector('#gameCanvas'),scoreEl=document.querySelector('#score'),coinsEl=document.querySelector('#coins'),bestEl=document.querySelector('#best'),statusEl=document.querySelector('#status'),toastEl=document.querySelector('#toast'),overlayEl=document.querySelector('#overlay'),startEl=document.querySelector('#startButton'),leftEl=document.querySelector('#leftButton'),rightEl=document.querySelector('#rightButton'),jumpEl=document.querySelector('#jumpButton');const renderer=new THREE.WebGLRenderer({canvas,antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,1.7));renderer.shadowMap.enabled=true;renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.22;const pmrem=new THREE.PMREMGenerator(renderer),env=pmrem.fromScene(new RoomEnvironment(),.05).texture,scene=new THREE.Scene();scene.background=new THREE.Color(0xbfe6ee);scene.fog=new THREE.Fog(0xbfe6ee,28,96);scene.environment=env;const camera=new THREE.PerspectiveCamera(54,1,.1,160);camera.position.set(0,5.15,11.6);camera.lookAt(0,1.55,-8);scene.add(new THREE.HemisphereLight(0xffffff,0xffd27a,2));const sun=new THREE.DirectionalLight(0xfff7e5,3.2);sun.position.set(7,11,7);sun.castShadow=true;scene.add(sun);const rim=new THREE.DirectionalLight(0xffc83d,3.1);rim.position.set(-6,5,3);scene.add(rim);const world=new THREE.Group();scene.add(world);const lanes=[-2.5,0,2.5],road=new THREE.Mesh(new THREE.BoxGeometry(9,.35,140),new THREE.MeshStandardMaterial({color:0xfff3dc,roughness:.8}));road.position.set(0,-.18,-42);world.add(road);[-4.6,4.6].forEach(x=>{const m=new THREE.Mesh(new THREE.BoxGeometry(.18,.4,140),new THREE.MeshStandardMaterial({color:0x2b2140}));m.position.set(x,0,-42);world.add(m)});[-1.25,1.25].forEach(x=>{for(let z=-105;z<18;z+=8){const d=new THREE.Mesh(new THREE.BoxGeometry(.08,.02,3),new THREE.MeshBasicMaterial({color:0xffffff,transparent:true,opacity:.55}));d.position.set(x,.02,z);d.userData.dash=1;world.add(d)}});for(let i=0;i<18;i++){const g=new THREE.Group(),mat=new THREE.MeshLambertMaterial({color:0xffffff,transparent:true,opacity:.8});[[0,0,.7],[.7,0,1],[-.7,0,.8],[.15,.35,.65]].forEach(a=>{const q=new THREE.Mesh(new THREE.SphereGeometry(a[2],16,12),mat);q.position.set(a[0],a[1],0);g.add(q)});g.position.set((Math.random()-.5)*30,3+Math.random()*10,-10-Math.random()*100);g.userData.cloud=1;scene.add(g)}const player=new THREE.Group();player.position.set(0,0,3);scene.add(player);let avatar=null,targetSkin=null,runMixer=null,runAction=null;function tuneGold(root){root.traverse(o=>{if(!o.isMesh)return;o.castShadow=true;o.receiveShadow=true;(Array.isArray(o.material)?o.material:[o.material]).forEach(m=>{const n=(m.name||'').toLowerCase();m.envMapIntensity=1.8;if(n.includes('gold')||n.includes('canvas')||n.includes('halo')){m.metalness=.95;m.roughness=.13;m.envMapIntensity=3.6;m.needsUpdate=true}})})}function norm(n){return n.toLowerCase().replace(/mixamorig\d*[:_]?/g,'').replace(/[^a-z0-9]/g,'')}function sourceMap(bones){const m=new Map();for(const b of bones)m.set(norm(b.name),b.name);return m}function pick(map,...keys){for(const k of keys){const hit=map.get(norm(k));if(hit)return hit}return null}function buildNames(targetBones,sourceBones){const src=sourceMap(sourceBones),aliases={pelvis:['Hips'],spine_01:['Spine'],spine_02:['Spine1'],spine_03:['Spine2'],neck_01:['Neck'],head:['Head'],clavicle_l:['LeftShoulder'],upperarm_l:['LeftArm'],lowerarm_l:['LeftForeArm'],hand_l:['LeftHand'],clavicle_r:['RightShoulder'],upperarm_r:['RightArm'],lowerarm_r:['RightForeArm'],hand_r:['RightHand'],thigh_l:['LeftUpLeg'],calf_l:['LeftLeg'],foot_l:['LeftFoot'],ball_l:['LeftToeBase','LeftToe_End'],thigh_r:['RightUpLeg'],calf_r:['RightLeg'],foot_r:['RightFoot'],ball_r:['RightToeBase','RightToe_End']},names={};for(const tb of targetBones){const a=aliases[tb.name];if(a){const s=pick(src,...a);if(s)names[tb.name]=s}}return names}async function loadAvatarAndMocap(){try{statusEl.textContent='Loading TOTZ…';const mml=await fetch(MML,{cache:'no-store'}).then(r=>r.text()),glbUrl=mml.match(/<m-character[^>]+src=[\"']([^\"']+)[\"']/i)?.[1];if(!glbUrl)throw new Error('No GLB in MML');const gltf=await new GLTFLoader().loadAsync(glbUrl);avatar=gltf.scene;const box=new THREE.Box3().setFromObject(avatar),size=box.getSize(new THREE.Vector3()),center=box.getCenter(new THREE.Vector3());avatar.position.sub(center);avatar.scale.setScalar(2.8/(Math.max(size.x,size.y,size.z)||1));const box2=new THREE.Box3().setFromObject(avatar),size2=box2.getSize(new THREE.Vector3()),center2=box2.getCenter(new THREE.Vector3());avatar.position.sub(center2);avatar.position.y=size2.y/2;avatar.rotation.y=Math.PI;avatar.traverse(o=>{if(!targetSkin&&o.isSkinnedMesh)targetSkin=o});if(!targetSkin)throw new Error('No skinned mesh');tuneGold(avatar);player.add(avatar);statusEl.textContent='Loading real run motion…';const srcFbx=await new FBXLoader().loadAsync(RUN);if(!srcFbx.animations?.length)throw new Error('Run clip missing');const helper=new THREE.SkeletonHelper(srcFbx),sourceSkeleton=new THREE.Skeleton(helper.bones),names=buildNames(targetSkin.skeleton.bones,helper.bones),hip=names.pelvis||pick(sourceMap(helper.bones),'Hips');if(!hip)throw new Error('Hip mapping failed');const retargeted=SkeletonUtils.retargetClip(targetSkin,sourceSkeleton,srcFbx.animations[0],{names,hip,hipInfluence:new THREE.Vector3(0,0,0),preserveBoneMatrix:true,preserveBonePositions:true,useFirstFramePosition:false});retargeted.name='TOTZ_REAL_RUN';runMixer=new THREE.AnimationMixer(targetSkin);runAction=runMixer.clipAction(retargeted);runAction.setLoop(THREE.LoopRepeat,Infinity);runAction.play();runAction.paused=true;statusEl.textContent='MOCAP READY ✓';setTimeout(()=>statusEl.style.opacity='.72',1000)}catch(e){console.error(e);statusEl.textContent='Mocap load failed — check console'}}loadAvatarAndMocap();let obstacles=[],pickup=[],state='menu',lane=1,targetX=0,yVel=0,onGround=true,score=0,count=0,speed=.34,obsTimer=20,pickTimer=42,last=performance.now(),lean=0,best=+localStorage.getItem('totzBestMocap')||0;bestEl.textContent=best;function spawnObstacle(){const h=Math.random()<.3?2.4:1.2,m=new THREE.Mesh(new THREE.BoxGeometry(1.45,h,1.4),new THREE.MeshStandardMaterial({color:0x2b2140,roughness:.65}));m.position.set(lanes[Math.floor(Math.random()*3)],h/2,-72);world.add(m);obstacles.push({m,h})}function spawnCoin(){const m=new THREE.Mesh(new THREE.TorusGeometry(.38,.13,12,28),new THREE.MeshStandardMaterial({color:0xd8ea35,metalness:.45,roughness:.2,envMapIntensity:2.5}));m.rotation.x=Math.PI/2;m.position.set(lanes[Math.floor(Math.random()*3)],1.2+Math.random(),-70);world.add(m);pickup.push(m)}function resetGame(){obstacles.forEach(o=>world.remove(o.m));pickup.forEach(m=>world.remove(m));obstacles=[];pickup=[];lane=1;targetX=0;player.position.set(0,0,3);player.rotation.z=0;yVel=0;onGround=true;score=0;count=0;speed=.34;obsTimer=20;pickTimer=42;scoreEl.textContent='0';coinsEl.textContent='0';if(runAction){runAction.reset().play();runAction.paused=false}}function startGame(){resetGame();state='play';overlayEl.style.display='none'}function move(d){if(state!=='play')return;lane=Math.max(0,Math.min(2,lane+d));targetX=lanes[lane];lean=-d*.07}function jump(){if(state==='play'&&onGround){yVel=.23;onGround=false}}function gameOver(){if(state!=='play')return;state='over';if(runAction)runAction.paused=true;const sc=Math.floor(score);if(sc>best){best=sc;localStorage.setItem('totzBestMocap',best);bestEl.textContent=best}document.querySelector('.card h1').innerHTML='CLOUD <span>DOWN!</span>';document.querySelector('.card p').innerHTML=`Score <b>${sc}</b> • ${count} $TOTZ`;startEl.textContent='RUN AGAIN';overlayEl.style.display='grid'}function collect(m){count++;coinsEl.textContent=count;score+=90;world.remove(m);m.userData.dead=1;toastEl.classList.add('show');setTimeout(()=>toastEl.classList.remove('show'),350)}addEventListener('totz-start',startGame);if(window.__totzStartRequested)startGame();leftEl.onclick=()=>move(-1);rightEl.onclick=()=>move(1);jumpEl.onclick=jump;addEventListener('keydown',e=>{if(['ArrowLeft','ArrowRight','ArrowUp','Space','KeyA','KeyD'].includes(e.code))e.preventDefault();if(e.code==='ArrowLeft'||e.code==='KeyA')move(-1);if(e.code==='ArrowRight'||e.code==='KeyD')move(1);if(e.code==='ArrowUp'||e.code==='Space')jump()});let touchX=null;canvas.onpointerdown=e=>touchX=e.clientX;canvas.onpointerup=e=>{if(touchX==null)return;const dx=e.clientX-touchX;Math.abs(dx)>45?move(dx>0?1:-1):jump();touchX=null};function resize(){renderer.setSize(innerWidth,innerHeight,false);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix()}addEventListener('resize',resize);resize();const clock=new THREE.Clock();function loop(now){requestAnimationFrame(loop);const dt=Math.min(2,(now-last)/16.667);last=now;const sec=clock.getDelta();player.position.x+=(targetX-player.position.x)*Math.min(1,.15*dt);lean*=Math.pow(.86,dt);player.rotation.z+=(lean-player.rotation.z)*.10*dt;if(runAction){runAction.paused=state!=='play';runAction.timeScale=.95+(speed-.34)*1.4;if(state==='play')runMixer.update(sec)}if(state==='play'){score+=dt*.8;speed=Math.min(.72,.34+score/9000);yVel-=.013*dt;player.position.y+=yVel*dt;if(player.position.y<=0){player.position.y=0;yVel=0;onGround=true}obsTimer-=dt;pickTimer-=dt;if(obsTimer<=0){spawnObstacle();obsTimer=50+Math.random()*30}if(pickTimer<=0){spawnCoin();pickTimer=42+Math.random()*45}for(const o of obstacles){o.m.position.z+=speed*dt*6.1;if(Math.abs(o.m.position.z-player.position.z)<1.05&&Math.abs(o.m.position.x-player.position.x)<.88&&player.position.y<=o.h*.62){gameOver();break}}for(const m of pickup){if(m.userData.dead)continue;m.position.z+=speed*dt*6.1;m.rotation.y+=.05*dt;if(Math.abs(m.position.z-player.position.z)<1.05&&Math.abs(m.position.x-player.position.x)<.85&&Math.abs(m.position.y-(player.position.y+1.1))<1.2)collect(m)}obstacles=obstacles.filter(o=>{if(o.m.position.z>14){world.remove(o.m);return false}return true});pickup=pickup.filter(m=>!m.userData.dead&&m.position.z<14);world.children.forEach(m=>{if(m.userData.dash){m.position.z+=speed*dt*6.1;if(m.position.z>15)m.position.z-=120}});scoreEl.textContent=Math.floor(score)}scene.children.forEach(o=>{if(o.userData.cloud){o.position.z+=.008*dt;if(o.position.z>18)o.position.z=-105}});camera.position.x+=(player.position.x*.14-camera.position.x)*.03*dt;camera.lookAt(player.position.x*.15,1.55,-8);renderer.render(scene,camera)}requestAnimationFrame(loop);</script></body></html>
