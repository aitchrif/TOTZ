name: FORGE Gasless Relay Status Probe

on:
  push:
    branches:
      - ops/forge-gasless-owner-7094
    paths:
      - '.github/workflows/forge-gasless-status-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read safe Edge Function environment health
        run: |
          set -euo pipefail
          curl -sS 'https://yymwpnztjlyfxongwmsw.supabase.co/functions/v1/forge-gasless-health'
          echo
      - name: Read Testnet relay status including failure body
        run: |
          set -euo pipefail
          curl -sS -w '\nHTTP_STATUS=%{http_code}\n' 'https://yymwpnztjlyfxongwmsw.supabase.co/functions/v1/forge-gasless-relay?route=status&chainId=46630'
