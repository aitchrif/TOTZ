name: FORGE Mainnet Readiness

on:
  push:
    branches: [forge-v1]
    paths:
      - 'forge-runtime-config.js'
      - 'forge-claim.html'
      - 'forge-claim.js'
      - 'forge-claim-launcher.html'
      - 'forge-claim-launcher.js'
      - 'forge-my-epochs.js'
      - 'artifacts/ForgeMerkleClaim.json'
      - 'artifacts/ForgeTestUSDG.json'
      - 'contracts/ForgeMerkleClaim.sol'
      - 'contracts/ForgeTestUSDG.sol'
      - 'supabase/functions/forge-claims/**'
      - 'supabase/migrations/20260906154000_forge_mainnet_release_gate.sql'
      - 'supabase/migrations/20260906161000_forge_mainnet_canary_policy.sql'
      - 'supabase/migrations/20260906163000_forge_mainnet_canary_expiry.sql'
      - 'supabase/sql/forge-mainnet-lockdown.sql'
      - 'tests/forge-mainnet-readiness.mjs'
      - 'tests/forge-published-claim-continuity.mjs'
      - 'tests/forge-release-handshake.mjs'
      - 'tests/forge-canary-expiry-invariant.mjs'
      - 'tests/forge-testnet-wallet-e2e.mjs'
      - 'tests/forge-canary-prep.mjs'
      - 'tests/forge-canary-arm-preview.mjs'
      - '.github/workflows/forge-testnet-wallet-e2e.yml'
      - '.github/workflows/forge-canary-prepare.yml'
      - '.github/workflows/forge-mainnet-readiness.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  locked-pre-canary:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          ref: forge-v1
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Parse release operator scripts
        run: |
          node --check tests/forge-testnet-wallet-e2e.mjs
          node --check tests/forge-canary-prep.mjs
          node --check tests/forge-canary-arm-preview.mjs
      - name: Verify atomic first-Canary arm stays preview-only
        env:
          FORGE_CLAIMS_URL: https://yymwpnztjlyfxongwmsw.supabase.co/functions/v1/forge-claims
          FORGE_CANARY_SPONSOR: '0x1111111111111111111111111111111111111111'
          FORGE_CANARY_HOURS: '2'
          FORGE_CANARY_MAX_WALLETS: '1'
        run: node tests/forge-canary-arm-preview.mjs >/tmp/forge-canary-arm-preview.txt
      - name: Verify published claim continuity under launch lockdown
        run: node tests/forge-published-claim-continuity.mjs
      - name: Verify Mainnet server release handshake invariant
        run: node tests/forge-release-handshake.mjs
      - name: Verify Canary expiry invariant
        env:
          FORGE_CLAIMS_URL: https://yymwpnztjlyfxongwmsw.supabase.co/functions/v1/forge-claims
        run: node tests/forge-canary-expiry-invariant.mjs
      - name: Install pinned read-only preflight dependency
        run: npm install --no-save ethers@6.15.0
      - name: Run locked mainnet readiness preflight
        env:
          FORGE_CLAIMS_URL: https://yymwpnztjlyfxongwmsw.supabase.co/functions/v1/forge-claims
        run: node tests/forge-mainnet-readiness.mjs
