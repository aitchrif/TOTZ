name: FORGE V2 Live Testnet 1

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: forge-v2-live-testnet-1
  cancel-in-progress: false

jobs:
  live-v2-relay:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: live/forge-v2-testnet-1

      - uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Fail closed unless the dedicated Testnet operator is configured
        env:
          FORGE_TESTNET_OPERATOR_PRIVATE_KEY: ${{ secrets.FORGE_TESTNET_OPERATOR_PRIVATE_KEY }}
        run: |
          if [ -z "$FORGE_TESTNET_OPERATOR_PRIVATE_KEY" ]; then
            echo "Missing repository secret: FORGE_TESTNET_OPERATOR_PRIVATE_KEY"
            exit 1
          fi

      - name: Install pinned live-Testnet dependencies
        run: npm install --no-save solc@0.8.24 @openzeppelin/contracts@5.0.1 ethers@6.15.0

      - name: Deploy, fund, authorize and relay one V2 claim on Robinhood Testnet
        env:
          FORGE_TESTNET_OPERATOR_PRIVATE_KEY: ${{ secrets.FORGE_TESTNET_OPERATOR_PRIVATE_KEY }}
          FORGE_TESTNET_RPC_URL: https://rpc.testnet.chain.robinhood.com
        run: node tests/forge-v2-live-testnet.mjs

      - name: Preserve live Testnet audit result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: forge-v2-live-testnet-1
          path: forge-v2-live-testnet-result.json
          if-no-files-found: ignore
          retention-days: 30
