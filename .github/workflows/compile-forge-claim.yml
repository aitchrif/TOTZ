name: Compile Forge Contracts

on:
  push:
    branches: [forge-v1]
    paths:
      - 'contracts/ForgeMerkleClaim.sol'
      - 'contracts/ForgeTestUSDG.sol'
      - '.github/workflows/compile-forge-claim.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: forge-v1
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install pinned compiler dependencies
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save solc@0.8.24 @openzeppelin/contracts@5.0.1
      - name: Compile Forge contracts
        run: |
          mkdir -p artifacts
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const solc = require('solc');
          const contractFiles = ['contracts/ForgeMerkleClaim.sol','contracts/ForgeTestUSDG.sol'];
          const sources = {};
          for (const file of contractFiles) sources[file] = {content: fs.readFileSync(file, 'utf8')};
          const input = {
            language: 'Solidity',
            sources,
            settings: {
              optimizer: {enabled: true, runs: 200},
              outputSelection: {'*': {'*': ['abi','evm.bytecode.object','evm.deployedBytecode.object','metadata']}}
            }
          };
          function findImports(importPath) {
            const p = path.resolve('node_modules', importPath);
            try { return {contents: fs.readFileSync(p, 'utf8')}; }
            catch (e) { return {error: `Import not found: ${importPath}`}; }
          }
          const output = JSON.parse(solc.compile(JSON.stringify(input), {import: findImports}));
          const errors = (output.errors || []).filter(e => e.severity === 'error');
          if (errors.length) {
            console.error(errors.map(e => e.formattedMessage).join('\n'));
            process.exit(1);
          }
          function writeArtifact(sourcePath, contractName) {
            const c = output.contracts[sourcePath][contractName];
            fs.writeFileSync(`artifacts/${contractName}.json`, JSON.stringify({
              contractName,
              compiler: '0.8.24',
              optimizer: {enabled: true, runs: 200},
              abi: c.abi,
              bytecode: '0x' + c.evm.bytecode.object,
              deployedBytecode: '0x' + c.evm.deployedBytecode.object
            }));
          }
          writeArtifact('contracts/ForgeMerkleClaim.sol','ForgeMerkleClaim');
          writeArtifact('contracts/ForgeTestUSDG.sol','ForgeTestUSDG');
          NODE
      - name: Commit deterministic artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/ForgeMerkleClaim.json artifacts/ForgeTestUSDG.json
          if git diff --cached --quiet; then
            echo "Artifacts unchanged"
          else
            git commit -m "Update Forge contract artifacts [skip ci]"
            git push origin HEAD:forge-v1
          fi
