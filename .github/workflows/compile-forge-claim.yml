name: Compile Forge Merkle Claim

on:
  push:
    branches: [forge-v1]
    paths:
      - 'contracts/ForgeMerkleClaim.sol'
      - '.github/workflows/compile-forge-claim.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: forge-v1
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install pinned compiler dependencies
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save solc@0.8.24 @openzeppelin/contracts@5.0.1
      - name: Compile ForgeMerkleClaim
        run: |
          mkdir -p artifacts
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const solc = require('solc');
          const source = fs.readFileSync('contracts/ForgeMerkleClaim.sol', 'utf8');
          const input = {
            language: 'Solidity',
            sources: {'contracts/ForgeMerkleClaim.sol': {content: source}},
            settings: {
              optimizer: {enabled: true, runs: 200},
              outputSelection: {'*': {'*': ['abi','evm.bytecode.object','evm.deployedBytecode.object','metadata']}}
            }
          };
          function findImports(importPath) {
            const p = path.resolve('node_modules', importPath);
            try { return {contents: fs.readFileSync(p, 'utf8')}; }
            catch (e) { return {error: `Import not found: ${importPath}`}; }
          }
          const output = JSON.parse(solc.compile(JSON.stringify(input), {import: findImports}));
          const errors = (output.errors || []).filter(e => e.severity === 'error');
          if (errors.length) {
            console.error(errors.map(e => e.formattedMessage).join('\n'));
            process.exit(1);
          }
          const c = output.contracts['contracts/ForgeMerkleClaim.sol'].ForgeMerkleClaim;
          const artifact = {
            contractName: 'ForgeMerkleClaim',
            compiler: '0.8.24',
            optimizer: {enabled: true, runs: 200},
            abi: c.abi,
            bytecode: '0x' + c.evm.bytecode.object,
            deployedBytecode: '0x' + c.evm.deployedBytecode.object
          };
          fs.writeFileSync('artifacts/ForgeMerkleClaim.json', JSON.stringify(artifact));
          NODE
      - name: Commit deterministic artifact
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/ForgeMerkleClaim.json
          if git diff --cached --quiet; then
            echo "Artifact unchanged"
          else
            git commit -m "Update Forge Merkle claim artifact [skip ci]"
            git push origin HEAD:forge-v1
          fi
