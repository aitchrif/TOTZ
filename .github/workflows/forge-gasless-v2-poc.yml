name: FORGE Gasless V2 Testnet PoC

on:
  pull_request:
    branches: [forge-v1]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  eip712-relay-security:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Verify V2 contract static safety invariants
        run: node tests/forge-gasless-v2-static.mjs
      - name: Verify hardened relay, release gates and holder UX invariants
        run: node tests/forge-gasless-hardening-static.mjs
      - name: Syntax-check browser holder claim flow
        run: node --check forge-claim.js && node --check forge-runtime-config.js
      - name: Install pinned local test dependencies
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save solc@0.8.24 @openzeppelin/contracts@5.0.1 ethers@6.15.0 ganache@7.9.2
      - name: Run V2 EIP-712 relay security suite
        run: node tests/forge-claim-v2.test.cjs
      - name: Verify V1 contract and Mainnet launch controls remain locked
        run: |
          git fetch --no-tags origin forge-v1:refs/remotes/origin/forge-v1
          git diff --exit-code origin/forge-v1...HEAD -- contracts/ForgeMerkleClaim.sol
          if ! grep -q 'const mainnetClaimsEnabled = false;' forge-runtime-config.js; then
            echo '::error::Gasless V2 hardening must not unlock Mainnet launches.'
            exit 1
          fi
          if ! grep -q 'const claimNetwork = networks.testnet;' forge-runtime-config.js; then
            echo '::error::Gasless V2 hardening must keep Testnet as the default launch network.'
            exit 1
          fi
          if ! grep -q "'gasless_mainnet_enabled',false" supabase/migrations/20260907224600_forge_gasless_v2_hardening.sql; then
            echo '::error::Gasless Mainnet must default to disabled.'
            exit 1
          fi
