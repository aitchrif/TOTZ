name: FORGE Gasless V2 Testnet PoC

on:
  pull_request:
    branches: [forge-v1]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  eip712-relay-security:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Verify V2 contract static safety invariants
        run: node tests/forge-gasless-v2-static.mjs
      - name: Verify hardened relay, release gates and holder UX invariants
        run: node tests/forge-gasless-hardening-static.mjs
      - name: Syntax-check browser holder claim flow
        run: node --check forge-claim.js && node --check forge-runtime-config.js
      - name: Install pinned local test dependencies
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save solc@0.8.24 @openzeppelin/contracts@5.0.1 ethers@6.15.0 ganache@7.9.2
      - name: Build deterministic V2 artifact for review
        run: |
          mkdir -p artifacts
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const solc = require('solc');
          const { keccak256 } = require('ethers');
          const sourcePath = 'contracts/ForgeMerkleClaimV2.sol';
          const input = {
            language: 'Solidity',
            sources: { [sourcePath]: { content: fs.readFileSync(sourcePath, 'utf8') } },
            settings: {
              optimizer: { enabled: true, runs: 200 },
              outputSelection: { '*': { '*': ['abi','evm.bytecode.object','evm.deployedBytecode.object','evm.deployedBytecode.immutableReferences','metadata'] } }
            }
          };
          function findImports(importPath) {
            const p = path.resolve('node_modules', importPath);
            try { return { contents: fs.readFileSync(p, 'utf8') }; }
            catch { return { error: `Import not found: ${importPath}` }; }
          }
          const output = JSON.parse(solc.compile(JSON.stringify(input), { import: findImports }));
          const errors = (output.errors || []).filter((e) => e.severity === 'error');
          if (errors.length) {
            console.error(errors.map((e) => e.formattedMessage).join('\n'));
            process.exit(1);
          }
          const c = output.contracts[sourcePath].ForgeMerkleClaimV2;
          const deployedBytecode = c.evm.deployedBytecode.object;
          const immutableReferences = c.evm.deployedBytecode.immutableReferences || {};
          const bytes = Buffer.from(deployedBytecode, 'hex');
          for (const ranges of Object.values(immutableReferences)) {
            for (const { start, length } of ranges) bytes.fill(0, start, start + length);
          }
          const artifact = {
            contractName: 'ForgeMerkleClaimV2',
            compiler: '0.8.24',
            optimizer: { enabled: true, runs: 200 },
            abi: c.abi,
            bytecode: '0x' + c.evm.bytecode.object,
            deployedBytecode: '0x' + deployedBytecode,
            immutableReferences,
            normalizedRuntimeHash: keccak256('0x' + bytes.toString('hex')),
          };
          fs.writeFileSync('artifacts/ForgeMerkleClaimV2.json', JSON.stringify(artifact));
          console.log(`ForgeMerkleClaimV2 normalizedRuntimeHash=${artifact.normalizedRuntimeHash}`);
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: forge-merkle-claim-v2-artifact
          path: artifacts/ForgeMerkleClaimV2.json
          if-no-files-found: error
          retention-days: 7
      - name: Run V2 EIP-712 relay security suite
        run: node tests/forge-claim-v2.test.cjs
      - name: Verify V1 contract and Mainnet launch controls remain locked
        run: |
          git fetch --no-tags origin forge-v1:refs/remotes/origin/forge-v1
          git diff --exit-code origin/forge-v1...HEAD -- contracts/ForgeMerkleClaim.sol
          if ! grep -q 'const mainnetClaimsEnabled = false;' forge-runtime-config.js; then
            echo '::error::Gasless V2 hardening must not unlock Mainnet launches.'
            exit 1
          fi
          if ! grep -q 'const claimNetwork = networks.testnet;' forge-runtime-config.js; then
            echo '::error::Gasless V2 hardening must keep Testnet as the default launch network.'
            exit 1
          fi
          if ! grep -q "'gasless_mainnet_enabled',false" supabase/migrations/20260907224600_forge_gasless_v2_hardening.sql; then
            echo '::error::Gasless Mainnet must default to disabled.'
            exit 1
          fi
