name: FORGE Commit Release Artifact

on:
  push:
    branches:
      - release/forge-final-hardening-2026-09-11

permissions:
  contents: write

jobs:
  commit-release-artifact:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/forge-final-hardening-2026-09-11
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Build release artifact from reviewed Solidity source
        run: node scripts/build-forge-claim-release.mjs artifacts/ForgeMerkleClaim.release.json
      - name: Commit release artifact
        run: |
          if git diff --quiet -- artifacts/ForgeMerkleClaim.release.json && git ls-files --error-unmatch artifacts/ForgeMerkleClaim.release.json >/dev/null 2>&1; then
            echo 'Release artifact already matches source.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add artifacts/ForgeMerkleClaim.release.json
          git commit -m 'build(forge): check in reproducible claim release artifact'
          git push origin HEAD:release/forge-final-hardening-2026-09-11
