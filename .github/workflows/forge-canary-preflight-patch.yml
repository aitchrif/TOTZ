name: FORGE Canary Preflight Patch

on:
  push:
    branches:
      - release/forge-canary-guardrails-2026-09-11

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/forge-canary-guardrails-2026-09-11
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply Canary transaction preflight hardening
        run: node scripts/apply-forge-canary-preflight.mjs
      - name: Commit hardened preflight
        run: |
          if git diff --quiet; then
            echo 'No patch diff to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add supabase/functions/forge-claims/index.ts forge-claim-launcher.js tests/forge-canary-guardrails.mjs
          git commit -m 'fix(forge): enforce Canary preflight cap and epoch slot'
          git push origin HEAD:release/forge-canary-guardrails-2026-09-11
