name: FORGE Browser Hardening Patch

on:
  push:
    branches:
      - release/forge-final-hardening-2026-09-11

permissions:
  contents: write

jobs:
  patch-release-branch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/forge-final-hardening-2026-09-11
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply browser and launcher release hardening edits
        run: node scripts/apply-forge-browser-hardening.mjs
      - name: Commit hardened release files
        run: |
          if git diff --quiet; then
            echo 'No release hardening diff to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add forge-claim.html forge-claim-launcher.html forge-my-epochs.html forge-floor-guard.html forge-epochs.html forge-claim-launcher.js vercel.json
          git commit -m 'security(forge): enforce release artifact and browser integrity'
          git push origin HEAD:release/forge-final-hardening-2026-09-11
