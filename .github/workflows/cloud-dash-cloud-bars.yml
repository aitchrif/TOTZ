name: Cloud Dash Cloud Bars

on:
  push:
    branches:
      - cloud-dash-preview
    paths:
      - '.github/workflows/cloud-dash-cloud-bars.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cloud-dash-preview
          fetch-depth: 0
      - name: Patch visuals
        run: python scripts/cloud-dash-cloud-bars-patch.py
      - name: Validate JavaScript
        run: node --check cloud-dash-v4.js
      - name: Commit patch
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cloud-dash-v4.js
          git commit -m "Render Cloud Dash obstacles as fluffy cloud bars"
          git push origin HEAD:cloud-dash-preview
