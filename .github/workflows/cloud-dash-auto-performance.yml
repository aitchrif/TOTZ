name: Cloud Dash Auto Performance

on:
  push:
    branches: [cloud-dash-preview]
    paths:
      - '.github/workflows/cloud-dash-auto-performance.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cloud-dash-preview
          fetch-depth: 0
      - name: Add adaptive visual quality
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('cloud-dash-v4.js')
          s=p.read_text()
          marker='// AUTO PERFORMANCE MODE'
          if marker in s:
              print('Auto performance mode already installed.')
              raise SystemExit(0)

          old="""  let leaderScope = 'all', lastComboShown = 1, lastCoinHud = 0, lastLifeHud = 3, runWasBest = false;\n  let state = freshState();\n  let player = freshPlayer();\n"""
          new="""  let leaderScope = 'all', lastComboShown = 1, lastCoinHud = 0, lastLifeHud = 3, runWasBest = false;\n  let state = freshState();\n  let player = freshPlayer();\n\n  // AUTO PERFORMANCE MODE — visual quality only; gameplay physics never change.\n  const QUALITY = [\n    { name: 'LOW', particleScale: .38, trailEvery: 3, sparkleStep: 4, shadow: 0, speedLines: false },\n    { name: 'BALANCED', particleScale: .68, trailEvery: 2, sparkleStep: 2, shadow: .55, speedLines: true },\n    { name: 'HIGH', particleScale: 1, trailEvery: 1, sparkleStep: 1, shadow: 1, speedLines: true }\n  ];\n  let qualityLevel = 2, perfFrames = 0, perfWindowStart = 0, perfLowStreak = 0, perfHighStreak = 0, perfFps = 60;\n  const quality = () => QUALITY[qualityLevel];\n\n  function ensurePerfBadge() {\n    let badge = $('perfBadge');\n    if (badge) return badge;\n    const foot = document.querySelector('.game-foot');\n    if (!foot) return null;\n    badge = document.createElement('span');\n    badge.id = 'perfBadge';\n    badge.style.cssText = 'margin-left:auto;padding:6px 9px;border-radius:999px;background:#eef6c9;color:#46521b;font-size:.58rem;font-weight:1000;white-space:nowrap;transition:background .25s,color .25s';\n    foot.appendChild(badge);\n    return badge;\n  }\n  function updatePerfBadge() {\n    const badge = ensurePerfBadge(); if (!badge) return;\n    badge.textContent = `AUTO • ${quality().name} • ${Math.max(0, Math.round(perfFps))} FPS`;\n    if (qualityLevel === 2) { badge.style.background = '#eef6c9'; badge.style.color = '#46521b'; }\n    else if (qualityLevel === 1) { badge.style.background = '#fff3dc'; badge.style.color = '#665b78'; }\n    else { badge.style.background = '#ffe0dc'; badge.style.color = '#8b2b1f'; }\n  }\n  function setQuality(level) {\n    qualityLevel = clamp(level, 0, QUALITY.length - 1);\n    perfLowStreak = 0; perfHighStreak = 0;\n    updatePerfBadge();\n  }\n  function initPerformanceMode() {\n    const cores = Number(navigator.hardwareConcurrency || 8);\n    const memory = Number(navigator.deviceMemory || 8);\n    const reduced = !!window.matchMedia?.('(prefers-reduced-motion: reduce)').matches;\n    qualityLevel = (cores <= 2 || memory <= 2) ? 0 : (cores <= 4 || memory <= 4 || reduced) ? 1 : 2;\n    perfWindowStart = performance.now(); perfFrames = 0; perfFps = 60;\n    updatePerfBadge();\n  }\n  function samplePerformance(now) {\n    if (document.hidden) { perfFrames = 0; perfWindowStart = now; return; }\n    perfFrames++;\n    if (!perfWindowStart) perfWindowStart = now;\n    const elapsed = now - perfWindowStart;\n    if (elapsed < 1800) return;\n    perfFps = perfFrames * 1000 / elapsed;\n    if (perfFps < 48) { perfLowStreak++; perfHighStreak = 0; }\n    else if (perfFps > 56) { perfHighStreak++; perfLowStreak = Math.max(0, perfLowStreak - 1); }\n    else { perfLowStreak = Math.max(0, perfLowStreak - 1); perfHighStreak = 0; }\n    if ((perfFps < 39 || perfLowStreak >= 2) && qualityLevel > 0) setQuality(qualityLevel - 1);\n    else if (perfHighStreak >= 4 && qualityLevel < 2) setQuality(qualityLevel + 1);\n    else updatePerfBadge();\n    perfFrames = 0; perfWindowStart = now;\n  }\n"""
          assert old in s, 'anchor 1 missing'
          s=s.replace(old,new,1)

          old="""  function burst(x, y, color, n) { for (let i = 0; i < n; i++) particles.push({ x, y, vx: vrand(-145, 145), vy: vrand(-145, 115), life: vrand(.35, .8), color, size: vrand(2, 6), spin: vrand(-5, 5) }); }\n"""
          new="""  function burst(x, y, color, n) { const count = Math.max(2, Math.round(n * quality().particleScale)); for (let i = 0; i < count; i++) particles.push({ x, y, vx: vrand(-145, 145), vy: vrand(-145, 115), life: vrand(.35, .8), color, size: vrand(2, 6), spin: vrand(-5, 5) }); }\n"""
          assert old in s, 'anchor 2 missing'
          s=s.replace(old,new,1)

          old="""    trail.push({ x: player.x + 28, y: player.y + player.h * .72, life: .48, s: vrand(5, 10) });\n    if (trail.length > 38) trail.shift(); for (const t of trail) { t.x -= state.speed * DT * .16; t.life -= DT; } trail = trail.filter(t => t.life > 0);\n"""
          new="""    if (state.step % quality().trailEvery === 0) trail.push({ x: player.x + 28, y: player.y + player.h * .72, life: .48, s: vrand(5, 10) });\n    const trailCap = qualityLevel === 2 ? 38 : qualityLevel === 1 ? 27 : 17;\n    while (trail.length > trailCap) trail.shift(); for (const t of trail) { t.x -= state.speed * DT * .16; t.life -= DT; } trail = trail.filter(t => t.life > 0);\n"""
          assert old in s, 'anchor 3 missing'
          s=s.replace(old,new,1)

          old="""    for (const s of sparkles) { const tw = .35 + Math.sin(state.t / 550 + s.p) * .25; ctx.globalAlpha = clamp(s.a * tw + dusk * .15, .05, .75); ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2); ctx.fill(); }\n    ctx.globalAlpha = 1;\n    for (const c of bgClouds.filter(c => c.layer === 0)) drawCloud(c.x, c.y, c.s * .72, .18);\n    for (const c of bgClouds.filter(c => c.layer === 1)) drawCloud(c.x, c.y, c.s, .33);\n    for (const c of bgClouds.filter(c => c.layer === 2)) drawCloud(c.x, c.y, c.s * 1.15, .5);\n    if (state.speed > 300) { ctx.strokeStyle = `rgba(255,255,255,${Math.min(.16, (state.speed - 300) / 500)})`; ctx.lineWidth = 2; for (let i = 0; i < 12; i++) { const y = (i * 47 + state.t / 5) % H; const x = (i * 91 + state.t / 3) % W; ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x - 55, y + 3); ctx.stroke(); } }\n"""
          new="""    for (let i = 0; i < sparkles.length; i += quality().sparkleStep) { const s = sparkles[i], tw = .35 + Math.sin(state.t / 550 + s.p) * .25; ctx.globalAlpha = clamp(s.a * tw + dusk * .15, .05, .75); ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2); ctx.fill(); }\n    ctx.globalAlpha = 1;\n    for (const c of bgClouds) {\n      if (qualityLevel === 0 && c.layer === 0) continue;\n      if (c.layer === 0) drawCloud(c.x, c.y, c.s * .72, .18);\n      else if (c.layer === 1) drawCloud(c.x, c.y, c.s, .33);\n      else drawCloud(c.x, c.y, c.s * 1.15, .5);\n    }\n    if (state.speed > 300 && quality().speedLines) { ctx.strokeStyle = `rgba(255,255,255,${Math.min(.16, (state.speed - 300) / 500)})`; ctx.lineWidth = 2; const lineCount = qualityLevel === 2 ? 12 : 7; for (let i = 0; i < lineCount; i++) { const y = (i * 47 + state.t / 5) % H; const x = (i * 91 + state.t / 3) % W; ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x - 55, y + 3); ctx.stroke(); } }\n"""
          assert old in s, 'anchor 4 missing'
          s=s.replace(old,new,1)

          s=s.replace("ctx.shadowColor = 'rgba(35,39,58,.22)'; ctx.shadowBlur = 12;", "ctx.shadowColor = 'rgba(35,39,58,.22)'; ctx.shadowBlur = Math.round(12 * quality().shadow);", 1)
          s=s.replace("ctx.shadowBlur = 24; ctx.fillStyle = '#ffd25a';", "ctx.shadowBlur = Math.round(24 * quality().shadow); ctx.fillStyle = '#ffd25a';", 1)
          s=s.replace("ctx.shadowBlur = 28; ctx.fillStyle = '#c9f7ff';", "ctx.shadowBlur = Math.round(28 * quality().shadow); ctx.fillStyle = '#c9f7ff';", 1)
          s=s.replace("ctx.shadowBlur = state.shield ? 42 : 24;", "ctx.shadowBlur = Math.round((state.shield ? 42 : 24) * quality().shadow);", 1)
          s=s.replace("ctx.shadowBlur = 8; ctx.fillText(f.text, f.x, f.y);", "ctx.shadowBlur = Math.round(8 * quality().shadow); ctx.fillText(f.text, f.x, f.y);", 1)

          old="""    for (const p of particles) { ctx.globalAlpha = clamp(p.life / .7, 0, 1); ctx.fillStyle = p.color; ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.spin * p.life); ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size); ctx.restore(); } ctx.globalAlpha = 1; drawFloatText();\n"""
          new="""    const particleStep = qualityLevel === 0 ? 2 : 1;\n    for (let i = 0; i < particles.length; i += particleStep) { const p = particles[i]; ctx.globalAlpha = clamp(p.life / .7, 0, 1); ctx.fillStyle = p.color; if (qualityLevel === 0) ctx.fillRect(p.x - p.size / 2, p.y - p.size / 2, p.size, p.size); else { ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.spin * p.life); ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size); ctx.restore(); } } ctx.globalAlpha = 1; drawFloatText();\n"""
          assert old in s, 'anchor 5 missing'
          s=s.replace(old,new,1)

          old="""  function loop(now) { if (!state.running) return; const frame = Math.min(.1, (now - last) / 1000 || DT); last = now; acc += frame; while (acc >= DT && state.running) { stepGame(); acc -= DT; } draw(); if (state.running) raf = requestAnimationFrame(loop); }\n"""
          new="""  function loop(now) { if (!state.running) return; samplePerformance(now); const frame = Math.min(.1, (now - last) / 1000 || DT); last = now; acc += frame; while (acc >= DT && state.running) { stepGame(); acc -= DT; } draw(); if (state.running) raf = requestAnimationFrame(loop); }\n"""
          assert old in s, 'anchor 6 missing'
          s=s.replace(old,new,1)

          old="""  function boot() {\n    injectPremiumUI();\n"""
          new="""  function boot() {\n    injectPremiumUI();\n    initPerformanceMode();\n"""
          assert old in s, 'anchor 7 missing'
          s=s.replace(old,new,1)

          p.write_text(s)
          print('Patched', p, 'bytes', len(s.encode()))
          PY
      - name: Validate JavaScript
        run: node --check cloud-dash-v4.js
      - name: Commit adaptive performance mode
        run: |
          if git diff --quiet; then
            echo "Nothing to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cloud-dash-v4.js
          git commit -m "Add adaptive performance mode to Cloud Dash"
          git push origin HEAD:cloud-dash-preview
