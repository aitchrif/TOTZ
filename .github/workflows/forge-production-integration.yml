name: FORGE Production Integration

on:
  pull_request:
    branches: [main]
    paths:
      - 'forge*'
      - 'artifacts/ForgeMerkleClaim.json'
      - 'artifacts/ForgeMerkleClaim.release.json'
      - 'api/forge-holders.js'
      - 'api/forge-floor-guard.js'
      - 'supabase/functions/forge-claims/**'
      - 'supabase/functions/forge-claims-gateway/**'
      - 'supabase/migrations/*forge_claim*'
      - 'supabase/migrations/*forge_canary*'
      - 'vercel.json'
      - 'tests/forge-production-integration.mjs'
      - 'tests/forge-floor-guard-integration.mjs'
      - 'tests/forge-security-regression.mjs'
      - 'tests/forge-backend-provenance-integration.mjs'
      - 'tests/forge-runtime-attestation-regression.mjs'
      - 'tests/forge-canary-guardrails.mjs'
      - 'tests/forge-csp-regression.mjs'
      - '.github/workflows/forge-production-integration.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  locked-production-surface:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned runtime dependency
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Verify locked Mainnet direct-claim integration
        run: node tests/forge-production-integration.mjs
      - name: Verify snapshot security regressions
        run: node tests/forge-security-regression.mjs
      - name: Verify backend and release provenance enforcement
        run: node tests/forge-backend-provenance-integration.mjs
      - name: Verify runtime immutable occurrence attestation
        run: node tests/forge-runtime-attestation-regression.mjs
      - name: Verify Mainnet Canary funding and single-epoch guardrails
        run: node tests/forge-canary-guardrails.mjs
      - name: Verify FLOOR GUARD read-only market intelligence
        run: node tests/forge-floor-guard-integration.mjs
      - name: Verify FORGE browser CSP and external scripts
        run: node tests/forge-csp-regression.mjs
