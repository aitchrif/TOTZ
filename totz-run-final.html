<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>TOTZ RUN FINAL</title><link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Nunito:wght@700;800&display=swap" rel="stylesheet"><script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.166.1/build/three.module.js","three/addons/":"https://unpkg.com/three@0.166.1/examples/jsm/"}}</script><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:Nunito,sans-serif;background:#bfe6ee;color:#2b2140;touch-action:none}.ui{position:fixed;inset:0;pointer-events:none}.top{position:absolute;top:16px;left:18px;right:18px;display:flex;justify-content:space-between;align-items:center;z-index:10}.logo{font:800 24px 'Baloo 2';pointer-events:auto}.home{pointer-events:auto;text-decoration:none;color:#2b2140;background:#fff3dc;border:2px solid #2b2140;border-radius:999px;padding:9px 14px;font-weight:800}.hud{position:absolute;top:16px;left:50%;transform:translateX(-50%);display:flex;gap:8px;z-index:10}.pill{background:#ffffffdd;border:2px solid #2b21401c;border-radius:16px;padding:7px 14px;text-align:center;min-width:92px}.pill small{display:block;font-size:10px;font-weight:800;color:#5b5270}.pill b{font:800 20px 'Baloo 2'}.overlay{position:absolute;inset:0;display:grid;place-items:center;background:#bfe6ee66;backdrop-filter:blur(3px);z-index:20;pointer-events:auto}.card{width:min(560px,92vw);padding:28px;text-align:center;background:#fffffff2;border:3px solid #2b214019;border-radius:28px;box-shadow:0 22px 60px #2b214029}.badge{display:inline-block;background:#cbdb2a;border-radius:999px;padding:7px 13px;font-weight:800;font-size:12px}.card h1{font:800 clamp(48px,10vw,82px)/.85 'Baloo 2';margin:14px 0 10px}.card h1 span{color:#f0533d}.card p{color:#5b5270;font-weight:800;line-height:1.5}.start{border:0;border-radius:999px;background:#ff7a66;color:white;padding:14px 28px;font:800 18px 'Baloo 2';box-shadow:0 8px 0 #f0533d;cursor:pointer}.load{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:#fff3dc;padding:11px 16px;border-radius:999px;font-weight:800;z-index:15}.controls{position:absolute;left:18px;right:18px;bottom:22px;display:flex;justify-content:space-between;z-index:12}.move{display:flex;gap:10px}.btn{pointer-events:auto;width:64px;height:64px;border:2px solid #2b21401f;border-radius:20px;background:#ffffffe5;font:800 24px 'Baloo 2';color:#2b2140}.jump{width:90px;background:#ff7a66e8;color:white;font-size:14px}.toast{position:absolute;top:90px;left:50%;transform:translateX(-50%);background:#cbdb2a;border-radius:999px;padding:8px 14px;font-weight:800;opacity:0;transition:.2s}.toast.show{opacity:1}@media(min-width:850px){.controls{display:none}}@media(max-width:849px){.hud{top:66px}.pill{min-width:78px;padding:6px 9px}.pill b{font-size:16px}.top{top:12px}}</style></head><body><canvas id="gameCanvas"></canvas><div class="ui"><div class="top"><div class="logo">● TOTZ RUN</div><a class="home" href="index.html">← Back home</a></div><div class="hud"><div class="pill"><small>SCORE</small><b id="score">0</b></div><div class="pill"><small>$TOTZ</small><b id="coins">0</b></div><div class="pill"><small>BEST</small><b id="best">0</b></div></div><div class="load" id="load">Loading rig…</div><div class="toast" id="toast">+1 $TOTZ</div><div class="overlay" id="overlay"><div class="card"><span class="badge">✨ HUMAN MOTION + SHINY GOLD</span><h1>TOTZ <span>RUN</span></h1><p>Arms and legs now move from the humanoid skeleton. Jump has its own pose, lane changes lean the body, and Gold Canvas gets metallic environment reflections.</p><button class="start" id="startButton">START RUN</button><p style="font-size:12px;margin-bottom:0">A / D or ← / → move • SPACE / ↑ jump</p></div></div><div class="controls"><div class="move"><button class="btn" id="leftButton">←</button><button class="btn" id="rightButton">→</button></div><button class="btn jump" id="jumpButton">JUMP</button></div></div><script type="module">import * as THREE from 'three';import{GLTFLoader}from'three/addons/loaders/GLTFLoader.js';import{RoomEnvironment}from'three/addons/environments/RoomEnvironment.js';const MML='https://raw.githubusercontent.com/aitchrif/otherside-avatar/main/avatar.mml',canvas=document.querySelector('#gameCanvas'),scoreEl=document.querySelector('#score'),coinsEl=document.querySelector('#coins'),bestEl=document.querySelector('#best'),loadEl=document.querySelector('#load'),toastEl=document.querySelector('#toast'),overlayEl=document.querySelector('#overlay'),startEl=document.querySelector('#startButton'),leftEl=document.querySelector('#leftButton'),rightEl=document.querySelector('#rightButton'),jumpEl=document.querySelector('#jumpButton'),r=new THREE.WebGLRenderer({canvas,antialias:true});r.setPixelRatio(Math.min(devicePixelRatio,1.7));r.shadowMap.enabled=true;r.outputColorSpace=THREE.SRGBColorSpace;r.toneMapping=THREE.ACESFilmicToneMapping;r.toneMappingExposure=1.25;const pm=new THREE.PMREMGenerator(r),env=pm.fromScene(new RoomEnvironment(),.05).texture,s=new THREE.Scene();s.background=new THREE.Color(0xbfe6ee);s.fog=new THREE.Fog(0xbfe6ee,28,96);s.environment=env;const cam=new THREE.PerspectiveCamera(54,1,.1,160);cam.position.set(0,5.2,11.5);cam.lookAt(0,1.6,-8);s.add(new THREE.HemisphereLight(0xffffff,0xffd27a,2));const sun=new THREE.DirectionalLight(0xfff7e5,3.3);sun.position.set(7,11,7);sun.castShadow=true;s.add(sun);const rim=new THREE.DirectionalLight(0xffc83d,3.4);rim.position.set(-6,5,3);s.add(rim);const blue=new THREE.DirectionalLight(0x8ed2e2,1.4);blue.position.set(5,4,-8);s.add(blue);const world=new THREE.Group();s.add(world);const lanes=[-2.5,0,2.5],road=new THREE.Mesh(new THREE.BoxGeometry(9,.35,140),new THREE.MeshStandardMaterial({color:0xfff3dc,roughness:.8}));road.position.set(0,-.18,-42);world.add(road);[-4.6,4.6].forEach(x=>{const m=new THREE.Mesh(new THREE.BoxGeometry(.18,.4,140),new THREE.MeshStandardMaterial({color:0x2b2140}));m.position.set(x,0,-42);world.add(m)});[-1.25,1.25].forEach(x=>{for(let z=-105;z<18;z+=8){const d=new THREE.Mesh(new THREE.BoxGeometry(.08,.02,3),new THREE.MeshBasicMaterial({color:0xffffff,transparent:true,opacity:.55}));d.position.set(x,.02,z);d.userData.dash=1;world.add(d)}});for(let i=0;i<18;i++){const g=new THREE.Group(),mat=new THREE.MeshLambertMaterial({color:0xffffff,transparent:true,opacity:.8});[[0,0,.7],[.7,0,1],[-.7,0,.8],[.15,.35,.65]].forEach(a=>{const q=new THREE.Mesh(new THREE.SphereGeometry(a[2],16,12),mat);q.position.set(a[0],a[1],0);g.add(q)});g.position.set((Math.random()-.5)*30,3+Math.random()*10,-10-Math.random()*100);g.userData.cloud=1;s.add(g)}const player=new THREE.Group();player.position.set(0,0,3);s.add(player);let av=null,avBaseY=0,mixer=null,useClip=false;const bones={},rest={},names=['pelvis','spine_01','spine_02','upperarm_l','upperarm_r','lowerarm_l','lowerarm_r','thigh_l','thigh_r','calf_l','calf_r','foot_l','foot_r','head'];function cache(){names.forEach(n=>{const b=av.getObjectByName(n);if(b){bones[n]=b;rest[n]={x:b.rotation.x,y:b.rotation.y,z:b.rotation.z}}})}function rot(n,x=0,y=0,z=0){const b=bones[n],q=rest[n];if(b&&q)b.rotation.set(q.x+x,q.y+y,q.z+z)}function tuneGold(){av.traverse(o=>{if(!o.isMesh)return;o.castShadow=true;o.receiveShadow=true;(Array.isArray(o.material)?o.material:[o.material]).forEach(m=>{const n=(m.name||'').toLowerCase();m.envMapIntensity=1.8;if(n.includes('gold')||n.includes('canvas')||n.includes('halo')){m.metalness=.95;m.roughness=.12;m.envMapIntensity=3.6;m.needsUpdate=true}})})}async function loadAvatar(){try{const txt=await fetch(MML,{cache:'no-store'}).then(x=>x.text()),u=txt.match(/<m-character[^>]+src=[\"']([^\"']+)[\"']/i)?.[1],g=await new GLTFLoader().loadAsync(u);av=g.scene;const b=new THREE.Box3().setFromObject(av),sz=b.getSize(new THREE.Vector3()),ct=b.getCenter(new THREE.Vector3());av.position.sub(ct);av.scale.setScalar(2.8/(Math.max(sz.x,sz.y,sz.z)||1));const b2=new THREE.Box3().setFromObject(av),sz2=b2.getSize(new THREE.Vector3()),ct2=b2.getCenter(new THREE.Vector3());av.position.sub(ct2);av.position.y=sz2.y/2;avBaseY=av.position.y;av.rotation.y=Math.PI;player.add(av);cache();tuneGold();const clip=g.animations?.find(a=>/run|jog|sprint/i.test(a.name))||g.animations?.find(a=>/walk/i.test(a.name));if(clip){mixer=new THREE.AnimationMixer(av);mixer.clipAction(clip).play();useClip=true}loadEl.style.display='none'}catch(e){console.error(e);loadEl.textContent='Avatar failed'}}loadAvatar();let obs=[],coins=[],state='menu',lane=1,target=0,yv=0,ground=true,score=0,count=0,speed=.34,ot=20,ct=42,last=performance.now(),lean=0,best=+localStorage.getItem('totzBestFinal')||0;bestEl.textContent=best;function spawnO(){const h=Math.random()<.3?2.4:1.2,m=new THREE.Mesh(new THREE.BoxGeometry(1.45,h,1.4),new THREE.MeshStandardMaterial({color:0x2b2140,roughness:.65}));m.position.set(lanes[Math.floor(Math.random()*3)],h/2,-72);world.add(m);obs.push({m,h})}function spawnC(){const m=new THREE.Mesh(new THREE.TorusGeometry(.38,.13,12,28),new THREE.MeshStandardMaterial({color:0xd8ea35,metalness:.45,roughness:.2,envMapIntensity:2.5}));m.rotation.x=Math.PI/2;m.position.set(lanes[Math.floor(Math.random()*3)],1.2+Math.random(),-70);world.add(m);coins.push(m)}function pose(t){if(!av||useClip)return;av.position.y=avBaseY;if(state==='play'&&ground){const p=t*10.5,a=Math.sin(p),b=Math.sin(p+Math.PI);rot('upperarm_l',a*.65);rot('upperarm_r',b*.65);rot('lowerarm_l',Math.max(0,-a)*.35);rot('lowerarm_r',Math.max(0,-b)*.35);rot('thigh_l',b*.62);rot('thigh_r',a*.62);rot('calf_l',Math.max(0,a)*.58);rot('calf_r',Math.max(0,b)*.58);rot('spine_01',.08,0,-player.rotation.z*.5);rot('pelvis',0,0,a*.035);av.position.y=avBaseY+Math.abs(a)*.035}else if(state==='play'&&!ground){rot('upperarm_l',-.45,0,-.1);rot('upperarm_r',-.45,0,.1);rot('thigh_l',-.38);rot('thigh_r',-.38);rot('calf_l',.62);rot('calf_r',.62);rot('spine_01',.1,0,-player.rotation.z*.4)}else{const b=Math.sin(t*2.2);rot('upperarm_l',.05+b*.02,0,.05);rot('upperarm_r',.05+b*.02,0,-.05);rot('thigh_l');rot('thigh_r');rot('calf_l');rot('calf_r');rot('spine_01',b*.015);rot('pelvis',0,0,b*.01)}}function reset(){obs.forEach(o=>world.remove(o.m));coins.forEach(m=>world.remove(m));obs=[];coins=[];lane=1;target=0;player.position.set(0,0,3);player.rotation.z=0;yv=0;ground=true;score=0;count=0;speed=.34;ot=20;ct=42;scoreEl.textContent='0';coinsEl.textContent='0'}function start(){reset();state='play';overlayEl.style.display='none';last=performance.now()}function move(d){if(state!=='play')return;lane=Math.max(0,Math.min(2,lane+d));target=lanes[lane];lean=-d*.14}function jump(){if(state==='play'&&ground){yv=.23;ground=false}}function over(){if(state!=='play')return;state='over';const sc=Math.floor(score);if(sc>best){best=sc;localStorage.setItem('totzBestFinal',best);bestEl.textContent=best}document.querySelector('.card h1').innerHTML='CLOUD <span>DOWN!</span>';document.querySelector('.card p').innerHTML=`Score <b>${sc}</b> • ${count} $TOTZ`;startEl.textContent='RUN AGAIN';overlayEl.style.display='grid'}function collect(m){count++;coinsEl.textContent=count;score+=90;world.remove(m);m.userData.dead=1;toastEl.classList.add('show');setTimeout(()=>toastEl.classList.remove('show'),350)}startEl.onclick=start;leftEl.onclick=()=>move(-1);rightEl.onclick=()=>move(1);jumpEl.onclick=jump;addEventListener('keydown',e=>{if(['ArrowLeft','ArrowRight','ArrowUp','Space','KeyA','KeyD'].includes(e.code))e.preventDefault();if(e.code==='ArrowLeft'||e.code==='KeyA')move(-1);if(e.code==='ArrowRight'||e.code==='KeyD')move(1);if(e.code==='ArrowUp'||e.code==='Space')jump()});let tx=null;canvas.onpointerdown=e=>tx=e.clientX;canvas.onpointerup=e=>{if(tx==null)return;const dx=e.clientX-tx;Math.abs(dx)>45?move(dx>0?1:-1):jump();tx=null};function resize(){r.setSize(innerWidth,innerHeight,false);cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix()}addEventListener('resize',resize);resize();const clock=new THREE.Clock();function loop(now){requestAnimationFrame(loop);const dt=Math.min(2,(now-last)/16.667);last=now;const sec=clock.getDelta(),t=clock.elapsedTime;if(mixer)mixer.update(sec);player.position.x+=(target-player.position.x)*Math.min(1,.18*dt);lean*=Math.pow(.82,dt);player.rotation.z+=(lean-player.rotation.z)*.16*dt;pose(t);if(state==='play'){score+=dt*.8;speed=Math.min(.72,.34+score/9000);yv-=.013*dt;player.position.y+=yv*dt;if(player.position.y<=0){player.position.y=0;yv=0;ground=true}ot-=dt;ct-=dt;if(ot<=0){spawnO();ot=50+Math.random()*30}if(ct<=0){spawnC();ct=42+Math.random()*45}for(const o of obs){o.m.position.z+=speed*dt*6.1;if(Math.abs(o.m.position.z-player.position.z)<1.05&&Math.abs(o.m.position.x-player.position.x)<.88&&player.position.y<=o.h*.62){over();break}}for(const m of coins){if(m.userData.dead)continue;m.position.z+=speed*dt*6.1;m.rotation.y+=.05*dt;if(Math.abs(m.position.z-player.position.z)<1.05&&Math.abs(m.position.x-player.position.x)<.85&&Math.abs(m.position.y-(player.position.y+1.1))<1.2)collect(m)}obs=obs.filter(o=>{if(o.m.position.z>14){world.remove(o.m);return false}return true});coins=coins.filter(m=>!m.userData.dead&&m.position.z<14);world.children.forEach(m=>{if(m.userData.dash){m.position.z+=speed*dt*6.1;if(m.position.z>15)m.position.z-=120}});scoreEl.textContent=Math.floor(score)}s.children.forEach(o=>{if(o.userData.cloud){o.position.z+=.008*dt;if(o.position.z>18)o.position.z=-105}});cam.position.x+=(player.position.x*.16-cam.position.x)*.035*dt;cam.lookAt(player.position.x*.18,1.6,-8);r.render(s,cam)}requestAnimationFrame(loop);</script></body></html>
